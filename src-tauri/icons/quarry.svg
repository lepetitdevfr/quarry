<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Quarry</title>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20242c"/>
      <stop offset="1" stop-color="#121419"/>
    </linearGradient>

    <linearGradient id="seam" x1="176" y1="300" x2="336" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7aacfb"/>
      <stop offset="1" stop-color="#3d7ce6"/>
    </linearGradient>
  </defs>

  <!-- Ground: the app's own background, so the icon sits in the dock the
       way the window sits on screen. -->
  <rect width="512" height="512" rx="114" fill="url(#ground)"/>

  <!-- Two terraces and the seam — three bands total, each as large as the
       canvas allows.
       Three attempts taught the lesson: an app icon is judged at 32px,
       where thin bands merge into a smear and close greys stop being
       distinguishable. So: fewer shapes, bigger, further apart in tone. -->
  <g>
    <rect x="64" y="120" width="384" height="88" fill="#39404e"/>
    <rect x="64" y="120" width="384" height="22" fill="#5a6578"/>

    <rect x="120" y="208" width="272" height="88" fill="#55606f"/>
    <rect x="120" y="208" width="272" height="22" fill="#7b8799"/>
  </g>

  <!-- The seam you were digging for: the accent blue the UI uses for
       anything active. -->
  <rect x="176" y="296" width="160" height="104" fill="url(#seam)"/>
  <rect x="176" y="296" width="160" height="22" fill="#a8ccff"/>
</svg>
