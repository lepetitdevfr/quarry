[package]
name = "quarry"
version = "0.1.0"
description = "A keyboard-first PostgreSQL client with a production write-guard"
authors = ["Lepetitdev"]
license = "MIT"
repository = "https://github.com/lepetitdevfr/quarry"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quarry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
deadpool-postgres = "0.14.1"
postgres-types = "0.2.14"
chrono = "0.4.45"
uuid = { version = "1.24.0", features = ["v4"] }
url = "2.5.8"
percent-encoding = "2.3.2"
thiserror = "2.0.20"
tokio-postgres-rustls = "0.14.0"
rustls = "0.23.43"
webpki-roots = "1.0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sqlparser = "0.58"
dirs = "6.0.0"

# `keyring` has no default backend: with no store feature enabled it
# compiles fine and silently keeps passwords in an in-process mock that
# vanishes at exit. That failure is invisible — the round-trip tests in
# secrets.rs would still pass — so the backend is named per platform
# rather than left to defaults.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Kept only to read the OSStatus back out of the error `keyring` boxes,
# for the errSecAuthFailed message in secrets.rs. It must stay on the
# same major as keyring's own `security-framework` dependency: a
# downcast across two majors is a different type and would never match,
# silently costing us that message.
security-framework = "3.7.0"

# `linux-native` (the kernel keyutils store) rather than Secret Service,
# which needs a D-Bus session bus and an unlocked keyring daemon —
# neither of which exists on a headless CI runner, where these tests
# have to pass.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }

