[package]
name = "quarry"
version = "0.7.1"
description = "A keyboard-first PostgreSQL client with a production write-guard"
authors = ["Lepetitdev"]
license = "MIT"
repository = "https://github.com/lepetitdevfr/quarry"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quarry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
deadpool-postgres = "0.14.1"
postgres-types = "0.2.14"
chrono = "0.4.45"
uuid = { version = "1.24.0", features = ["v4"] }
url = "2.5.8"
percent-encoding = "2.3.2"
thiserror = "2.0.20"
tokio-postgres-rustls = "0.14.0"
rustls = "0.23.43"
webpki-roots = "1.0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sqlparser = "0.58"
dirs = "6.0.0"
sqlformat = "0.5.0"

# macOS talks to the Keychain directly rather than through `keyring`.
# `keyring`'s macOS backend passes an explicit SecKeychain to
# `find_generic_password`, and that makes macOS authorise the keychain
# and the item separately — two prompts for one read, measured. The
# modern SecItem API in `security_framework::passwords` asks once.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

# `keyring` has no default backend: with no store feature enabled it
# compiles fine and silently keeps passwords in an in-process mock that
# vanishes at exit — invisible, because the round-trip tests would still
# pass. So the backend is named per platform rather than left to
# defaults.
#
# `linux-native` (the kernel keyutils store) rather than Secret Service,
# which needs a D-Bus session bus and an unlocked keyring daemon —
# neither of which exists on a headless CI runner, where these tests
# have to pass.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3.27.0"
# `test-util` only: it is what gives tests a pausable clock, so the
# connect deadline can be proven without spending ten real seconds.
tokio = { version = "1.53.1", features = ["test-util"] }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }

