name: Release

# Push to main and semantic-release decides, from the commit messages, whether
# there is a release and what version it is. `feat:` bumps the minor, `fix:`
# and `refactor:` the patch, a `BREAKING CHANGE:` footer the major; `docs:`,
# `test:`, `ci:` and `chore:` release nothing.
on:
  push:
    branches: [main]
  # Rehearsal: builds every platform and uploads artifacts, releases nothing.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The public repo the artifacts are published to. This repo stays private,
  # and a private repo's release assets cannot be downloaded without a token.
  RELEASES_REPO: lepetitdevfr/quarry-releases

jobs:
  # Runs first and alone: the version has to exist before anything is built,
  # because it is baked into tauri.conf.json and names every artifact.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      notes: ${{ steps.semantic.outputs.new_release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads tag history to find the last release; a
          # shallow clone makes it think every release is the first.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Version and changelog
        id: semantic
        if: github.event_name == 'push'
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
            @semantic-release/exec@6
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: version
    if: needs.version.outputs.published == 'true' || github.event_name == 'workflow_dispatch'

    strategy:
      # One platform failing must not cost the others: macOS is the supported
      # build and the other two are beta, so a Linux packaging problem should
      # not withhold the .dmg.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: aarch64-macos
            bundles: app,dmg
          - os: ubuntu-latest
            label: x86_64-linux
            bundles: deb,appimage
          - os: windows-latest
            label: x86_64-windows
            bundles: msi,nsis

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The tag semantic-release just pushed, so the build carries the
          # version bump it committed. On a rehearsal there is no tag, so the
          # branch tip is what gets built.
          ref: ${{ needs.version.outputs.published == 'true' && format('v{0}', needs.version.outputs.version) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      # Tauri links against the system webview on Linux. These are the
      # packages its own CI guide names for a Debian-family runner.
      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      # `continue-on-error` because the Linux and Windows builds are beta and
      # unproven: a packaging failure on either should leave the macOS release
      # intact rather than sink it. The collect step below fails if nothing at
      # all was produced.
      - name: Build
        continue-on-error: ${{ matrix.os != 'macos-14' }}
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --verbose

      - name: Collect the bundles
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version || github.sha }}"
          mkdir -p dist-artifacts
          found=0

          # ditto for the .app, not zip: it preserves the symlinks and
          # resource forks the bundle needs to stay launchable.
          app=$(ls -d src-tauri/target/release/bundle/macos/*.app 2>/dev/null | head -1 || true)
          if [ -n "$app" ]; then
            ditto -c -k --keepParent "$app" "dist-artifacts/Quarry-$version-aarch64.app.zip"
            found=1
          fi

          for f in \
            src-tauri/target/release/bundle/dmg/*.dmg \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/nsis/*.exe
          do
            [ -e "$f" ] || continue
            ext="${f##*.}"
            cp "$f" "dist-artifacts/Quarry-$version-${{ matrix.label }}.$ext"
            found=1
          done

          if [ "$found" = "0" ]; then
            echo "::warning::${{ matrix.label }} produced no bundles"
          fi
          ls -la dist-artifacts || true

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.label }}
          path: dist-artifacts/*
          if-no-files-found: ignore

  publish:
    needs: [version, build]
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: dist-artifacts

      - run: ls -la dist-artifacts

      # The notes are semantic-release's own, generated from the commits, so
      # the public release says the same thing as CHANGELOG.md.
      - name: Publish to the public releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          # A fine-grained PAT scoped to the releases repo, Contents: read and
          # write. GITHUB_TOKEN cannot reach another repository.
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ needs.version.outputs.version }}
          name: Quarry v${{ needs.version.outputs.version }}
          files: dist-artifacts/*
          body: |
            ${{ needs.version.outputs.notes }}

            ---

            **Every build here is beta.** Quarry is pre-1.0, unsigned, and has
            been used in earnest by one person. Back up anything you point it
            at, and keep the write-guard on for production connections.

            ### macOS (Apple Silicon) — beta, tested

            Unsigned, so macOS quarantines it and refuses the first open:

            ```bash
            xattr -dr com.apple.quarantine /Applications/Quarry.app
            ```

            ### Linux and Windows — beta, never run

            These build in CI and have **never been run on a real machine**.
            The credential store in particular — kernel keyutils on Linux,
            Credential Manager on Windows — has only ever been compiled, and
            the fonts and `⌘` shortcut labels are still macOS-shaped. Treat
            them as previews and report what breaks.
