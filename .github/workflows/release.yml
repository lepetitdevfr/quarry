name: Release

# Tag-driven: `git tag v0.1.0 && git push origin v0.1.0` builds and publishes.
# The tag is the trigger and the version, so nothing here needs editing per
# release — but the tag must match `version` in src-tauri/tauri.conf.json and
# package.json, or the .dmg inside will disagree with the release name.
on:
  push:
    tags: ["v*"]
  # Lets a build be rehearsed without tagging: the publish step is skipped.
  workflow_dispatch:

env:
  # The public repo the .dmg is published to. This repo stays private, and a
  # private repo's release assets cannot be downloaded without a token — so
  # the artifact goes somewhere public while the source does not.
  RELEASES_REPO: lepetitdevfr/quarry-releases

jobs:
  release:
    # Apple Silicon runner: the app is macOS-only and this is the arch it
    # ships for. An Intel build would need a second matrix entry with
    # `--target x86_64-apple-darwin`.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The .app is bundled first and separately. DMG creation is the flaky
      # step on a headless runner — it drives hdiutil and, on some images,
      # Finder via AppleScript — and a DMG problem should not cost the build
      # that already succeeded.
      - name: Build the app
        run: npm run tauri build -- --bundles app --verbose

      # `hdiutil` intermittently reports "Resource busy" on CI when a volume
      # from an earlier attempt is still detaching, so one retry after a
      # pause fixes most failures. `--verbose` keeps the real error visible
      # when it does not.
      - name: Bundle the .dmg
        id: bundle
        continue-on-error: true
        run: |
          npm run tauri build -- --bundles dmg --verbose \
            || (echo "retrying dmg bundle"; sleep 15; npm run tauri build -- --bundles dmg --verbose)

      # Renamed with the tag so a downloaded file says which version it is:
      # Tauri names every build from the config version, which stops being
      # bumped by hand sooner or later. Ships whichever bundles exist. A .zip of the .app is a perfectly good
      # macOS download — it is what many notarised apps distribute — so a
      # failed DMG degrades the release rather than blocking it.
      - name: Collect the artifacts
        id: dmg
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          out=""

          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null | head -1 || true)
          if [ -n "$dmg" ]; then
            mv "$dmg" "Quarry-$version-aarch64.dmg"
            out="Quarry-$version-aarch64.dmg"
          else
            echo "::warning::no .dmg was produced — publishing the .app as a zip instead"
          fi

          app=$(ls -d src-tauri/target/release/bundle/macos/*.app 2>/dev/null | head -1 || true)
          if [ -n "$app" ]; then
            # ditto, not zip: it preserves the resource forks and symlinks an
            # .app bundle needs to stay launchable.
            ditto -c -k --keepParent "$app" "Quarry-$version-aarch64.app.zip"
            out="$out"$'\n'"Quarry-$version-aarch64.app.zip"
          fi

          if [ -z "$out" ]; then
            echo "neither a .dmg nor an .app was built"
            exit 1
          fi

          {
            echo "paths<<EOF"
            echo "$out"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Uploaded on every run, tag or not, so a dispatch rehearsal still
      # produces something to open and check before anything is published.
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: ${{ steps.dmg.outputs.paths }}

      - name: Publish to the public releases repo
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          # A fine-grained PAT scoped to the releases repo only, with
          # Contents: read and write. The default GITHUB_TOKEN cannot reach
          # another repository.
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Quarry ${{ github.ref_name }}
          files: ${{ steps.dmg.outputs.paths }}
          body: |
            Apple Silicon build, unsigned. macOS quarantines it and will
            refuse the first open until the flag is cleared:

            ```bash
            xattr -dr com.apple.quarantine /Applications/Quarry.app
            ```
