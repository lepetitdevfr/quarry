name: Release

# Releasing is a decision, not a side effect of merging: this runs only when
# you start it. Three platforms take about twenty minutes, and most commits do
# not deserve a release.
#
# semantic-release still picks the version from the commit messages when it
# runs — `feat:` bumps the minor, `fix:` and `refactor:` the patch, a
# `BREAKING CHANGE:` footer the major; `docs:`, `test:`, `ci:` and `chore:`
# release nothing at all, which is how a run can end with no version to build.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse: build every platform, publish nothing"
        type: boolean
        default: false
      rebuild_tag:
        description: "Rebuild and publish an existing version, WITHOUT the v (e.g. 0.2.0). Skips semantic-release."
        type: string
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The public repo the artifacts are published to. This repo stays private,
  # and a private repo's release assets cannot be downloaded without a token.
  RELEASES_REPO: lepetitdevfr/quarry-releases

jobs:
  # Runs first and alone: the version has to exist before anything is built,
  # because it is baked into tauri.conf.json and names every artifact.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # `rebuild_tag` republishes a version that was already cut — the case
      # where the build failed after semantic-release had tagged, leaving a
      # tag with no artifacts behind it. semantic-release will not cut a new
      # version for that, because nothing has changed since.
      published: ${{ inputs.rebuild_tag != '' && 'true' || steps.semantic.outputs.new_release_published }}
      version: ${{ inputs.rebuild_tag != '' && inputs.rebuild_tag || steps.semantic.outputs.new_release_version }}
      notes: ${{ steps.semantic.outputs.new_release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads tag history to find the last release; a
          # shallow clone makes it think every release is the first.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Version and changelog
        id: semantic
        if: inputs.dry_run != true && inputs.rebuild_tag == ''
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
            @semantic-release/exec@6
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: version
    # A rehearsal always builds; a real run only when there was something to
    # release.
    if: needs.version.outputs.published == 'true' || inputs.dry_run == true

    strategy:
      # One platform failing must not cost the others: macOS is the supported
      # build and the other two are beta, so a Linux packaging problem should
      # not withhold the .dmg.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: aarch64-macos
            bundles: dmg
          - os: ubuntu-latest
            label: x86_64-linux
            bundles: deb,appimage
          - os: windows-latest
            label: x86_64-windows
            # NSIS only. An .msi is the same installer for the same person,
            # differing mainly in being deployable by Group Policy — and
            # building it pulls the WiX toolset down on every run.
            bundles: nsis

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The tag semantic-release just pushed, so the build carries the
          # version bump it committed. On a rehearsal there is no tag, so the
          # branch tip is what gets built.
          ref: ${{ needs.version.outputs.published == 'true' && format('v{0}', needs.version.outputs.version) || github.ref }}
          # The tag semantic-release pushed moments ago may not be visible to
          # this checkout yet; fetching tags explicitly avoids a race.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      # Tauri links against the system webview on Linux. These are the
      # packages its own CI guide names for a Debian-family runner.
      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      # `continue-on-error` because the Linux and Windows builds are beta and
      # unproven: a packaging failure on either should leave the macOS release
      # intact rather than sink it. The collect step below fails if nothing at
      # all was produced.
      # `hdiutil: create failed - Resource busy` is the macOS runner's
      # signature failure: a disk image from an earlier attempt is still
      # detaching, or Spotlight has the volume open. Detaching anything
      # stale and retrying clears it. Three attempts because the window is
      # short and a release should not die on a race.
      - name: Build
        continue-on-error: ${{ matrix.os != 'macos-14' }}
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if npm run tauri build -- --bundles ${{ matrix.bundles }} --verbose; then
              exit 0
            fi
            echo "::warning::build attempt $attempt failed"

            if [ "${{ matrix.os }}" = "macos-14" ]; then
              # Detach any Quarry volume the failed run left mounted, and
              # give the kernel a moment to release the device.
              hdiutil info | awk '/\/Volumes\/Quarry/ {print $1}' | while read -r dev; do
                echo "detaching stale volume $dev"
                hdiutil detach "$dev" -force || true
              done
              sleep 20
            else
              sleep 10
            fi
          done
          echo "build failed after 3 attempts"
          exit 1

      - name: Collect the bundles
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version || github.sha }}"
          mkdir -p dist-artifacts
          found=0

          for f in \
            src-tauri/target/release/bundle/dmg/*.dmg \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/nsis/*.exe
          do
            [ -e "$f" ] || continue
            ext="${f##*.}"
            cp "$f" "dist-artifacts/Quarry-$version-${{ matrix.label }}.$ext"
            found=1
          done

          if [ "$found" = "0" ]; then
            echo "::warning::${{ matrix.label }} produced no bundles"
          fi
          ls -la dist-artifacts || true

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.label }}
          path: dist-artifacts/*
          if-no-files-found: ignore

  publish:
    needs: [version, build]
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: dist-artifacts

      - run: ls -la dist-artifacts

      # The notes are semantic-release's own, generated from the commits, so
      # the public release says the same thing as CHANGELOG.md.
      - name: Publish to the public releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          # A fine-grained PAT scoped to the releases repo, Contents: read and
          # write. GITHUB_TOKEN cannot reach another repository.
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ needs.version.outputs.version }}
          name: Quarry v${{ needs.version.outputs.version }}
          files: dist-artifacts/*
          body: |
            ${{ needs.version.outputs.notes }}

            ---

            **Every build here is beta.** Quarry is pre-1.0, unsigned, and has
            been used in earnest by one person. Back up anything you point it
            at, and keep the write-guard on for production connections.

            ### macOS (Apple Silicon) — beta, tested

            Unsigned, so macOS quarantines it and refuses the first open:

            ```bash
            xattr -dr com.apple.quarantine /Applications/Quarry.app
            ```

            ### Linux and Windows — beta, never run

            These build in CI and have **never been run on a real machine**.
            The credential store in particular — kernel keyutils on Linux,
            Credential Manager on Windows — has only ever been compiled, and
            the fonts and `⌘` shortcut labels are still macOS-shaped. Treat
            them as previews and report what breaks.
