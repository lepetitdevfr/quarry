name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: the older run's result
# is about code nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # `npm run build` runs tsc, so this is the typecheck as well as the
      # bundle. A type error must fail CI, not just the editor.
      - run: npm run build

  # Two Rust jobs, and neither is redundant. Linux is where the database
  # tests can run — GitHub's macOS runners have no Docker daemon — and macOS
  # is the platform users are on and the only one that compiles the Keychain
  # branch of `secrets.rs` at all.
  rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri links against the system webview. These are the packages its
      # own CI guide names for a Debian-family runner.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The whole suite, including the ~198 tests that start throwaway
      # Postgres 17 containers through testcontainers. This is the job the
      # cross-platform port existed to make possible.
      - name: Test
        run: cargo test
        working-directory: src-tauri

  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      # Unit tests only: no Docker here. The Keychain tests in this set are
      # the reason the job exists — they exercise code Linux cannot compile.
      - name: Unit tests
        run: cargo test --lib
        working-directory: src-tauri

      # Proves the shipped artifact still builds on the platform it ships to.
      - name: Build
        run: cargo build
        working-directory: src-tauri
