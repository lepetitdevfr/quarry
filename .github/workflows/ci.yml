name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: the older run's result
# is about code nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # `npm run build` runs tsc, so this is the typecheck as well as the
      # bundle. A type error must fail CI, not just the editor.
      - run: npm run build

  # macOS, not Linux: `secrets.rs` uses `security_framework::passwords`, which
  # the crate only exposes on macOS, and `menu.rs` builds an about-menu that
  # exists nowhere else. The app is macOS-only, so the crate does not compile
  # anywhere else — see the Windows/Linux entry in docs/BACKLOG.md.
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      # Unit tests only. The integration suites start throwaway Postgres
      # containers through testcontainers, and GitHub's macOS runners ship no
      # Docker daemon — while Linux runners, which do, cannot compile this
      # crate at all. So CI covers the pure modules and the lint, and the
      # database tests stay a local gate: `cargo test` before pushing.
      #
      # `--all-targets` above still type-checks and lints the integration
      # tests, so they cannot rot unnoticed.
      - name: Unit tests
        run: cargo test --lib
        working-directory: src-tauri
