name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: the older run's result
# is about code nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # `npm run build` runs tsc, so this is the typecheck as well as the
      # bundle. A type error must fail CI, not just the editor.
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri links against the system webview on Linux. The app is macOS-only
      # today, but the tests run here because the integration tests need
      # Docker, and GitHub's macOS runners do not have it.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      # Integration tests start throwaway Postgres 17 containers through
      # testcontainers, using the Docker daemon the runner already has.
      - name: Test
        run: cargo test
        working-directory: src-tauri
